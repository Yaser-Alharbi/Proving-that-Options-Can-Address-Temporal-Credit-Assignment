name: options-tcap
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # src/ (NetHack, PyTorch)
      - torch
      - minigrid
      - gymnasium
      - numpy
      - tyro
      - tensorboard
      - nle
      # navix/ (JAX). jax[cuda12] pulls the GPU plugin
      - jax[cuda12]
      - navix
      - flax
      - optax
      - distrax
      - rlax
      - matplotlib
      - pandas