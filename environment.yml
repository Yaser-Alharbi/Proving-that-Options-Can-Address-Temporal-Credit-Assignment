name: options-tcap
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # nle builds from source and none of these are installable without root
  - cmake
  - cxx-compiler
  - bison
  - flex
  - pip:
      # src/ (NetHack, PyTorch). Check turin's driver with nvidia-smi and match
      # the cu version; cu124 works with driver 550+.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch
      - minigrid
      - gymnasium
      - numpy
      - tyro
      - tensorboard
      - nle
      # navix/ (JAX). jax[cuda12] pulls the GPU plugin
      - jax[cuda12]
      - navix
      - flax
      - optax
      - distrax
      - rlax
      - matplotlib
      - pandas
      - pyarrow